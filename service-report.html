<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create a service report in English or Greek and download an A4 PDF. Your entries stay in your browser."><title>Service report builder · Tsakioan</title><link rel="icon" href="favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#0d1c30;color:#e8f1ff;font:16px/1.65 Arial,sans-serif}main{max-width:920px;margin:auto;padding:24px 24px 64px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:36px}a{color:#acd2ff;text-underline-offset:4px}h1{font-size:clamp(30px,5vw,44px);line-height:1.2;margin:12px 0 18px}h2{font-size:22px;margin:0 0 20px}.eyebrow{font-size:12px;letter-spacing:2px;color:#94c9ff}.intro{color:#bed0e7;max-width:720px}.notice{border-left:3px solid #8bbfff;padding:12px 18px;background:#142c46;color:#c9dbf1;font-size:14px}.panel{border:1px solid #3b5d80;border-radius:12px;padding:28px;margin-top:26px;background:#142940}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{margin-bottom:20px}.grid .field{margin:0}label{display:block;font-weight:600;margin-bottom:7px}input,textarea,select{width:100%;min-width:0;border:1px solid #6383a4;border-radius:6px;background:#0c1d30;color:#eff6ff;padding:12px;font:16px/1.5 Arial,sans-serif;min-height:48px;color-scheme:dark}textarea{min-height:130px;resize:vertical}input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #90c8ff;outline-offset:3px}button{min-height:48px;border:1px solid #89b8e8;border-radius:7px;padding:12px 18px;background:#1b3d5d;color:#eff6ff;font:600 15px/1.4 Arial;cursor:pointer}button:hover{background:#2a5277}button:disabled{opacity:.6;cursor:wait}.primary{background:#bfdfff;color:#10233a}.primary:hover{background:#d7ecff}.actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:24px}.hint{font-size:13px;color:#b4cae2;margin:6px 0 0}.status{min-height:26px;color:#bfddff;overflow-wrap:anywhere}.clear-box{border:1px solid #88abd2;border-radius:8px;padding:18px;margin:18px 0}.footer{margin-top:32px;font-size:14px;color:#b2c7df}.footer a{margin-right:20px}[hidden]{display:none!important}@media(max-width:600px){main{padding:20px 18px 44px}.panel{padding:22px 16px}.grid{grid-template-columns:1fr}.actions>*{flex:1 1 100%}header{gap:12px}h1{font-size:32px}}
</style></head><body><main><header><a href="./#experience" data-key="back"></a><button id="language" type="button"></button></header><div class="eyebrow">TSAKIOAN / IT TOOLKIT</div><h1 data-key="title"></h1><p class="intro" data-key="intro"></p><p class="notice" data-key="privacy"></p>
<form id="report-form" autocomplete="off">
<section class="panel" aria-labelledby="details-title"><h2 id="details-title" data-key="details"></h2><div class="grid">
<div class="field"><label for="reference" data-key="reference"></label><input id="reference" maxlength="100"></div>
<div class="field"><label for="date" data-key="date"></label><input id="date" type="date" required></div>
<div class="field"><label for="technician" data-key="technician"></label><input id="technician" maxlength="160"></div>
<div class="field"><label for="customer" data-key="customer"></label><input id="customer" maxlength="200"></div>
<div class="field"><label for="device" data-key="device"></label><input id="device" maxlength="200"></div>
<div class="field"><label for="serial" data-key="serial"></label><input id="serial" maxlength="160"></div>
</div><p class="hint" data-key="optional"></p></section>
<section class="panel" aria-labelledby="work-title"><h2 id="work-title" data-key="work"></h2>
<div class="field"><label for="issue" data-key="issueLabel"></label><textarea id="issue" required maxlength="8000" aria-describedby="issue-hint"></textarea><p id="issue-hint" class="hint" data-key="issueHint"></p></div>
<div class="field"><label for="checks" data-key="checksLabel"></label><textarea id="checks" required maxlength="8000" aria-describedby="checks-hint"></textarea><p id="checks-hint" class="hint" data-key="checksHint"></p></div>
<div class="field"><label for="repair" data-key="repairLabel"></label><textarea id="repair" required maxlength="8000" aria-describedby="repair-hint"></textarea><p id="repair-hint" class="hint" data-key="repairHint"></p></div>
<div class="field"><label for="outcome" data-key="outcome"></label><select id="outcome"><option value="pending" data-key="pending"></option><option value="resolved" data-key="resolved"></option><option value="monitor" data-key="monitor"></option><option value="parts" data-key="parts"></option><option value="escalated" data-key="escalated"></option></select></div>
<div class="field"><label for="notes" data-key="notes"></label><textarea id="notes" maxlength="8000" aria-describedby="notes-hint"></textarea><p id="notes-hint" class="hint" data-key="notesHint"></p></div>
</section>
<p class="hint" data-key="format"></p><div class="actions"><button id="download" class="primary" type="submit" data-key="download"></button><button id="clear" type="button" data-key="clear"></button></div>
<div class="clear-box" id="clear-box" hidden><p data-key="confirmClear"></p><div class="actions"><button id="confirm-clear" type="button" data-key="yesClear"></button><button id="cancel-clear" type="button" data-key="keep"></button></div></div>
<p id="status" class="status" role="status" aria-live="polite"></p></form>
<footer class="footer"><p data-key="footer"></p><a id="help-link" href="printer-help.html" data-key="help"></a><a id="test-link" href="print-test.html" data-key="test"></a></footer><noscript>JavaScript is required to create a PDF. / Απαιτείται JavaScript για τη δημιουργία PDF.</noscript>
</main><script src="report-pdf-lib.min.js" defer></script><script src="report-fontkit.umd.min.js" defer></script><script src="report-pdf.js?v=1" defer></script><script src="service-report.js?v=2" defer></script></body></html>
